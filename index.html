<!DOCTYPE html>
<html lang="en">
<head>
    <h1>Welcome to Padmesh's AWSPortfolio</h1>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Welcome Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .container{
            text-align:center;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding:50px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
            max-width:700px;
        }

        h1{
            font-size:3rem;
            margin-bottom:20px;
        }

        .aws{
            color:#ff9900;
        }

        p{
            font-size:1.2rem;
            line-height:1.8;
            color:#d1d5db;
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background:#ff9900;
            color:white;
            padding:15px 35px;
            border-radius:50px;
            font-size:1.1rem;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            transform:translateY(-3px);
            background:#ffb84d;
        }

        .services{
            margin-top:30px;
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        .service{
            background:rgba(255,255,255,0.1);
            padding:10px 20px;
            border-radius:30px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>☁ Motherfucker <span class="aws">Sanjay</span></h1>

    <p>
        Your journey into cloud computing starts here.
        Explore scalable infrastructure, secure storage,
        powerful databases, and modern DevOps practices with Amazon Web Services.
    </p>

    <a href="#" class="btn">Get Started</a>

    <div class="services">
        <div class="service">EC2</div>
        <div class="service">S3</div>
        <div class="service">Lambda</div>
        <div class="service">RDS</div>
        <div class="service">CloudFront</div>
    </div>
</div>

</body>
</html>
